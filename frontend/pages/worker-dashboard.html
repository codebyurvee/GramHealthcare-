<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Community Health Worker Dashboard - GramHealthcare">
    <title>Worker Dashboard - GramHealthcare</title>
    <link rel="manifest" href="/public/manifest.json">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="dashboard-navbar">
            <div class="container">
                <h1 class="logo">GramHealthcare</h1>
                <div class="user-menu">
                    <span id="workerName">Health Worker</span>
                    <a href="/pages/login.html" class="btn btn-small">Logout</a>
                </div>
            </div>
        </nav>

        <div class="dashboard-container">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li><a href="#overview" class="active">Overview</a></li>
                    <li><a href="#patients">My Patients</a></li>
                    <li><a href="#referrals">Referrals</a></li>
                    <li><a href="#facilities">Facilities</a></li>
                    <li><a href="#reports">Reports</a></li>
                    <li><a href="#profile">Profile</a></li>
                </ul>
            </aside>

            <main class="dashboard-content">
                <section id="overview" class="dashboard-section">
                    <h2>Welcome, <span id="workerFullName">Health Worker</span></h2>
                    <div class="cards-grid">
                        <div class="card">
                            <h3>Patients Under Care</h3>
                            <p class="card-stat" id="patientCount">0</p>
                        </div>
                        <div class="card">
                            <h3>Pending Referrals</h3>
                            <p class="card-stat" id="pendingReferrals">0</p>
                        </div>
                        <div class="card">
                            <h3>Completed Referrals</h3>
                            <p class="card-stat" id="completedReferrals">0</p>
                        </div>
                    </div>
                </section>

                <section id="patients" class="dashboard-section hidden">
                    <h2>My Patients</h2>
                    <button class="btn btn-primary">Add New Patient</button>
                    <div id="patientsList" class="list-container">
                        <!-- Patients will be loaded here -->
                    </div>
                </section>

                <section id="referrals" class="dashboard-section hidden">
                    <h2>Referrals Management</h2>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="pending">Pending</button>
                        <button class="tab-btn" data-tab="completed">Completed</button>
                        <button class="tab-btn" data-tab="rejected">Rejected</button>
                    </div>
                    <div id="referralsList" class="list-container">
                        <!-- Referrals will be loaded here -->
                    </div>
                </section>

                <section id="facilities" class="dashboard-section hidden">
                    <h2>Healthcare Facilities</h2>
                    <div id="facilitiesList" class="list-container">
                        <!-- Facilities will be loaded here -->
                    </div>
                </section>

                <section id="reports" class="dashboard-section hidden">
                    <h2>Reports</h2>
                    <div class="report-filters">
                        <input type="date" id="reportStartDate" placeholder="Start Date">
                        <input type="date" id="reportEndDate" placeholder="End Date">
                        <button class="btn btn-primary">Generate Report</button>
                    </div>
                    <div id="reportsList" class="list-container">
                        <!-- Reports will be loaded here -->
                    </div>
                </section>

                <section id="profile" class="dashboard-section hidden">
                    <h2>My Profile</h2>
                    <form id="profileForm" class="profile-form">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="workArea">Work Area</label>
                            <input type="text" id="workArea" name="workArea" required>
                        </div>
                        <div class="form-group">
                            <label for="license">License Number</label>
                            <input type="text" id="license" name="license" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="/assets/js/dashboard.js"></script>
    <script src="/assets/js/worker-dashboard.js"></script>
</body>
</html>
