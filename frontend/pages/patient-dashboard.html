<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patient Dashboard - GramHealthcare">
    <title>Patient Dashboard - GramHealthcare</title>
    <link rel="manifest" href="/public/manifest.json">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="dashboard-navbar">
            <div class="container">
                <h1 class="logo">GramHealthcare</h1>
                <div class="user-menu">
                    <span id="userName">Patient</span>
                    <a href="/pages/login.html" class="btn btn-small">Logout</a>
                </div>
            </div>
        </nav>

        <div class="dashboard-container">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li><a href="#overview" class="active">Overview</a></li>
                    <li><a href="#medical-history">Medical History</a></li>
                    <li><a href="#referrals">My Referrals</a></li>
                    <li><a href="#appointments">Appointments</a></li>
                    <li><a href="#facilities">Find Facilities</a></li>
                    <li><a href="#profile">Profile</a></li>
                </ul>
            </aside>

            <main class="dashboard-content">
                <section id="overview" class="dashboard-section">
                    <h2>Welcome, <span id="patientName">Patient</span></h2>
                    <div class="cards-grid">
                        <div class="card">
                            <h3>Active Referrals</h3>
                            <p class="card-stat" id="activeReferrals">0</p>
                        </div>
                        <div class="card">
                            <h3>Pending Appointments</h3>
                            <p class="card-stat" id="pendingAppointments">0</p>
                        </div>
                        <div class="card">
                            <h3>Last Visit</h3>
                            <p class="card-stat" id="lastVisit">-</p>
                        </div>
                    </div>
                </section>

                <section id="medical-history" class="dashboard-section hidden">
                    <h2>Medical History</h2>
                    <div id="medicalHistoryList" class="list-container">
                        <!-- Medical records will be loaded here -->
                    </div>
                </section>

                <section id="referrals" class="dashboard-section hidden">
                    <h2>My Referrals</h2>
                    <div id="referralsList" class="list-container">
                        <!-- Referrals will be loaded here -->
                    </div>
                </section>

                <section id="appointments" class="dashboard-section hidden">
                    <h2>My Appointments</h2>
                    <div id="appointmentsList" class="list-container">
                        <!-- Appointments will be loaded here -->
                    </div>
                </section>

                <section id="facilities" class="dashboard-section hidden">
                    <h2>Nearby Facilities</h2>
                    <div id="facilitiesList" class="list-container">
                        <!-- Facilities will be loaded here -->
                    </div>
                </section>

                <section id="profile" class="dashboard-section hidden">
                    <h2>My Profile</h2>
                    <form id="profileForm" class="profile-form">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location" name="location" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="/assets/js/dashboard.js"></script>
    <script src="/assets/js/patient-dashboard.js"></script>
</body>
</html>
