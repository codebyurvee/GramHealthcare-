<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GramHealthcare Login">
    <title>Login - GramHealthcare</title>
    <link rel="manifest" href="/public/manifest.json">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div id="app">
        <div class="login-container">
            <div class="login-card">
                <h1 class="login-title">GramHealthcare</h1>
                <h2>Login</h2>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>

                    <div class="form-group">
                        <label for="userRole">Role</label>
                        <select id="userRole" name="userRole" required>
                            <option value="">Select your role</option>
                            <option value="patient">Patient</option>
                            <option value="worker">Community Health Worker</option>
                            <option value="facility">Facility Admin</option>
                            <option value="admin">System Admin</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>

                <p class="login-footer">Don't have an account? <a href="#signup">Sign up here</a></p>
            </div>
        </div>
    </div>

    <script src="/assets/js/auth.js"></script>
</body>
</html>
